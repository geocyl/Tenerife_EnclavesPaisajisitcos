<!doctype html> 
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visor Tenerife • Leaflet</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; width: 100%; }

    .leaflet-bar a.emoji-btn {
      font-size: 18px; line-height: 26px; width: 26px; height: 26px; text-align: center;
    }

    /* Leyenda / gestor de capas */
    .legend-control.leaflet-control{
      background:#fff;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.15);
      padding:10px; min-width: 260px; font:13px/1.2 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    }
    .legend-control h4{margin:0 0 6px 0;font-size:14px}
    .legend-section{margin-top:8px}
    .legend-item{display:flex;align-items:center;gap:8px;margin:6px 0}
    .legend-item input[type="checkbox"]{transform:translateY(1px)}
    .legend-swatch{width:16px;height:12px;border:2px solid #000;box-sizing:border-box;border-radius:2px}
    .legend-swatch.line{height:0;border-top-width:3px;border-bottom-width:0;border-color:#00599C}
    .legend-swatch.point{width:10px;height:10px;border-radius:50%;border-color:#143D6B;background:#4DA3FF}
    .legend-slider{display:flex;align-items:center;gap:8px;margin:6px 0}
    .legend-slider input[type="range"]{width:150px}
    details summary{cursor:pointer;user-select:none;margin:6px 0;font-weight:600}
    .cat-list{margin-left:4px}
    .cat-row{display:flex;align-items:center;gap:8px;margin:4px 0}
    .cat-name{flex:1}

    /* Swatch a rayas para la Biosfera en la leyenda (visual) */
    .swatch-bios { 
      background: repeating-linear-gradient(45deg, #800020, #800020 4px, transparent 4px, transparent 8px);
      border-color:#800020 !important;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <!-- Plugin para rellenos a rayas (opcional). Si no carga, usaremos relleno liso. -->
  <script src="https://unpkg.com/leaflet.pattern/leaflet.pattern.js"></script>

  <script>
    // --- Centro/zoom iniciales ---
    const centerTenerife = [28.2916, -16.6291];
    const initialZoom = 10;

    const maxBoundsTenerife = L.latLngBounds([27.9, -17.2], [28.7, -15.8]);

    const map = L.map('map', {
      center: centerTenerife,
      zoom: initialZoom,
      minZoom: 7,
      zoomControl: true,
      maxBounds: maxBoundsTenerife,
      maxBoundsViscosity: 0.5
    });

    // --- Botón HOME (volver a vista inicial) ---
    const HomeControl = L.Control.extend({
      options: { position: 'topleft' },
      onAdd: function() {
        const container = L.DomUtil.create('div', 'leaflet-bar');
        const link = L.DomUtil.create('a', 'emoji-btn', container);
        link.href = '#';
        link.title = 'Volver a vista inicial';
        link.setAttribute('aria-label','Volver a vista inicial');
        link.innerHTML = '🏠';
        L.DomEvent.on(link, 'click', L.DomEvent.stop)
                  .on(link, 'click', () => map.setView(centerTenerife, initialZoom));
        return container;
      }
    });
    map.addControl(new HomeControl());

    // --- Botón GEOLOCALIZACIÓN ---
    let locateMarker, locateCircle;
    const LocateControl = L.Control.extend({
      options: { position: 'topleft' }, // debajo del home
      onAdd: function() {
        const container = L.DomUtil.create('div', 'leaflet-bar');
        const link = L.DomUtil.create('a', 'emoji-btn', container);
        link.href = '#';
        link.title = 'Ir a mi ubicación';
        link.setAttribute('aria-label','Ir a mi ubicación');
        link.innerHTML = '📍';
        L.DomEvent.on(link, 'click', L.DomEvent.stop)
                  .on(link, 'click', () => {
                    if (!navigator.geolocation) { alert('Tu navegador no soporta geolocalización.'); return; }
                    navigator.geolocation.getCurrentPosition(
                      (pos) => {
                        const latlng = [pos.coords.latitude, pos.coords.longitude];
                        const acc = pos.coords.accuracy || 50;

                        if (!locateMarker) locateMarker = L.marker(latlng, { title: 'Mi ubicación' }).addTo(map);
                        else locateMarker.setLatLng(latlng);

                        if (!locateCircle) locateCircle = L.circle(latlng, { radius: acc }).addTo(map);
                        else locateCircle.setLatLng(latlng).setRadius(acc);

                        map.flyTo(latlng, 14, { duration: 0.8 });
                      },
                      (err) => alert('No se pudo obtener tu ubicación (' + err.message + ').'),
                      { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
                    );
                  });
        return container;
      }
    });
    map.addControl(new LocateControl());

    // --- Bases ---
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    });

    const esriSat = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 20, attribution: 'Imagery &copy; Esri, Earthstar Geographics' }
    );

    const cartoLight = L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      { maxZoom: 20, subdomains: 'abcd', attribution: '&copy; OpenStreetMap &copy; <a href="https://carto.com/attributions">CARTO</a>' }
    );

    osm.addTo(map); // base por defecto

    // =========================
    //  CAPA MUNICIPIOS (LÍMITE)
    // =========================
    const municipiosPaneName = 'municipios-pane';
    map.createPane(municipiosPaneName);
    map.getPane(municipiosPaneName).style.zIndex = 300; // por debajo de otros overlays

    const municipiosStyle = { color: '#00599C', weight: 2, fill: false, opacity: 1 };

    const municipiosLayer = L.geoJSON(null, {
      pane: municipiosPaneName,
      interactive: false,  // sin clics
      style: municipiosStyle
    });

    fetch('https://raw.githubusercontent.com/geocyl/Tenerife_EnclavesPaisajisitcos/refs/heads/main/Munis_Limite.json')
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(geo => municipiosLayer.addData(geo))
      .catch(err => console.warn('No se pudo cargar municipios:', err));

    municipiosLayer.addTo(map); // activa desde el inicio

    // =========================
    // CAPA ENCLAVES (PUNTOS) — SIEMPRE POR ENCIMA
    // =========================
    const enclavesPaneName = 'enclaves-pane';
    map.createPane(enclavesPaneName);
    map.getPane(enclavesPaneName).style.zIndex = 650; // > markerPane(600) y > overlayPane(400)

    const enclavesStyle = { radius: 6, weight: 2, color: '#143D6B', fillColor: '#4DA3FF', fillOpacity: 0.9 };

    const enclavesLayer = L.geoJSON(null, {
      pointToLayer: (feature, latlng) => L.circleMarker(latlng, { pane: enclavesPaneName, ...enclavesStyle }),
      onEachFeature: (feature, layer) => {
        const name = feature?.properties?.Name || 'Enclave';
        layer.bindPopup(`<b>${name}</b>`);
      }
    });

    fetch('https://raw.githubusercontent.com/geocyl/Tenerife_EnclavesPaisajisitcos/refs/heads/main/Puntos_Enclaves.json')
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(geo => { enclavesLayer.addData(geo); enclavesLayer.bringToFront(); })
      .catch(err => console.warn('No se pudo cargar enclaves:', err));

    enclavesLayer.addTo(map); // activa desde el inicio

    // =========================
    // CAPA BIC TENERIFE (POLÍGONOS) con categorías y opacidad (50%)
    // =========================
    const bicPaneName = 'bic-pane';
    map.createPane(bicPaneName);
    map.getPane(bicPaneName).style.zIndex = 450; // Municipios(300) < BIC(450) < ENP(500) < Biosfera(525) < Enclaves(650)

    const norm = s => (s || '').toString().trim().toUpperCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'');

    const BIC_COLORS = {
      'CONJUNTO HISTORICO':   { fill:[  6,169,230], stroke:[  0, 77,168] },
      'JARDIN HISTORICO':     { fill:[211,255,190], stroke:[ 38,115,  0] },
      'MONUMENTO':            { fill:[255,127,127], stroke:[168,  0,  0] },
      'SITIO ETNOLOGICO':     { fill:[209,255,115], stroke:[152,230,  0] },
      'SITIO HISTORICO':      { fill:[232,190,255], stroke:[132,  0,168] },
      'ZONA ARQUEOLOGICA':    { fill:[255,255,115], stroke:[230,230,  0] },
      'ZONA PALEONTOLOGICA':  { fill:[158,215,194], stroke:[ 68,137,112] }
    };
    const BIC_LABELS = {
      'CONJUNTO HISTORICO':'Conjunto Histórico',
      'JARDIN HISTORICO':'Jardín Histórico',
      'MONUMENTO':'Monumento',
      'SITIO ETNOLOGICO':'Sitio Etnológico',
      'SITIO HISTORICO':'Sitio Histórico',
      'ZONA ARQUEOLOGICA':'Zona Arqueológica',
      'ZONA PALEONTOLOGICA':'Zona Paleontológica'
    };
    const rgb = a => `rgb(${a[0]},${a[1]},${a[2]})`;

    let bicOpacity = 0.5;

    function styleBIC(feature) {
      const raw = feature?.properties?.bic_catego;
      const key = norm(raw);
      const c = BIC_COLORS[key] || { fill:[200,200,200], stroke:[120,120,120] };
      return {
        color: rgb(c.stroke),
        weight: 2,
        opacity: bicOpacity,
        fillColor: rgb(c.fill),
        fillOpacity: bicOpacity
      };
    }

    const bicLayer = L.geoJSON(null, {
      pane: bicPaneName,
      style: styleBIC,
      onEachFeature: (feature, layer) => {
        const nombre = feature?.properties?.bic_nombre || 'BIC';
        const cat    = feature?.properties?.bic_catego || '';
        const desc   = feature?.properties?.bic_descri || '';
        layer.bindPopup(`<b>${nombre}</b>${cat ? '<br>'+cat : ''}${desc ? '<br>'+desc : ''}`);
      }
    });

    fetch('https://raw.githubusercontent.com/geocyl/Tenerife_EnclavesPaisajisitcos/refs/heads/main/BIC_Tenerife.geojson')
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(geo => { bicLayer.addData(geo); enclavesLayer.bringToFront(); })
      .catch(err => console.warn('No se pudo cargar BIC:', err));

    bicLayer.addTo(map);

    // =========================
    // CAPA ENP TENERIFE (POLÍGONOS) con categorías y opacidad (50%)
    // =========================
    const enpPaneName = 'enp-pane';
    map.createPane(enpPaneName);
    map.getPane(enpPaneName).style.zIndex = 500; // por encima de BIC, por debajo de Biosfera/Enclaves

    const ENP_COLORS = {
      'MONUMENTO NATURAL':         { fill:[  0, 77,168] },
      'PAISAJE PROTEGIDO':         { fill:[166,166,255] },
      'PARQUE NACIONAL':           { fill:[255,255,115] },
      'PARQUE NATURAL':            { fill:[255,170,  0] },
      'PARQUE RURAL':              { fill:[255,127,127] },
      'RESERVA NATURAL ESPECIAL':  { fill:[112,168,  0] },
      'RESERVA NATURAL INTEGRAL':  { fill:[ 38,115,  0] },
      'SITIO DE INTERES CIENTIFICO': { fill:[233,255,190] }
    };
    const ENP_LABELS = {
      'MONUMENTO NATURAL':'Monumento Natural',
      'PAISAJE PROTEGIDO':'Paisaje Protegido',
      'PARQUE NACIONAL':'Parque Nacional',
      'PARQUE NATURAL':'Parque Natural',
      'PARQUE RURAL':'Parque Rural',
      'RESERVA NATURAL ESPECIAL':'Reserva Natural Especial',
      'RESERVA NATURAL INTEGRAL':'Reserva Natural Integral',
      'SITIO DE INTERES CIENTIFICO':'Sitio de Interés Científico'
    };

    let enpOpacity = 0.5;

    function styleENP(feature) {
      const raw = feature?.properties?.categoria;
      const key = norm(raw);
      const c = ENP_COLORS[key] || { fill:[200,200,200] };
      return {
        color: '#000',              // borde negro
        weight: 2,
        opacity: enpOpacity,        // borde
        fillColor: rgb(c.fill),
        fillOpacity: enpOpacity     // relleno
      };
    }

    const enpLayer = L.geoJSON(null, {
      pane: enpPaneName,
      style: styleENP,
      onEachFeature: (feature, layer) => {
        const nombre = feature?.properties?.nombre || 'ENP';
        const categoria = feature?.properties?.categoria || '';
        layer.bindPopup(`<b>${nombre}</b>${categoria ? '<br>'+categoria : ''}`);
      }
    });

    fetch('./ENP_Tenerife.geojson')
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(geo => { enpLayer.addData(geo); enclavesLayer.bringToFront(); })
      .catch(err => console.warn('No se pudo cargar ENP:', err));

    enpLayer.addTo(map);

    // =========================
    // CAPA BIOSFERA TENERIFE (POLÍGONOS) con rayas o liso y opacidad (50%)
    // =========================
    const biosPaneName = 'bios-pane';
    map.createPane(biosPaneName);
    map.getPane(biosPaneName).style.zIndex = 525; // por encima de ENP/BIC, debajo de Enclaves

    let biosOpacity = 0.5;
    const BIOS_COLOR = '#800020'; // granate

    // Intentar usar patrón de rayas si el plugin está disponible
    let biosStripes = null;
    function makeBiosPattern(opacity) {
      if (window.L && L.StripePattern) {
        const pat = new L.StripePattern({
          weight: 4,          // grosor de las rayas
          spaceWeight: 4,     // separación
          color: BIOS_COLOR,  // color de las rayas
          opacity: opacity,   // opacidad de las rayas
          angle: 45
        });
        pat.addTo(map);
        return pat;
      }
      return null;
    }
    biosStripes = makeBiosPattern(biosOpacity);

    function styleBios(feature) {
      // Si hay patrón disponible, úsalo; si no, relleno liso granate
      const base = {
        color: BIOS_COLOR,     // borde del polígono (granate)
        weight: 1.5,
        opacity: biosOpacity
      };
      if (biosStripes) {
        return { ...base, fillPattern: biosStripes };
      } else {
        return { ...base, fillColor: BIOS_COLOR, fillOpacity: biosOpacity };
      }
    }

    const biosLayer = L.geoJSON(null, {
      pane: biosPaneName,
      style: styleBios,
      onEachFeature: (feature, layer) => {
        const name = feature?.properties?.MAB_NAME || 'Reserva de la Biosfera';
        layer.bindPopup(`<b>${name}</b>`);
      }
    });

    fetch('https://raw.githubusercontent.com/geocyl/Tenerife_EnclavesPaisajisitcos/refs/heads/main/BiosferaTen.geojson')
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(geo => { biosLayer.addData(geo); enclavesLayer.bringToFront(); })
      .catch(err => console.warn('No se pudo cargar Biosfera:', err));

    biosLayer.addTo(map);

    // =========================
    // CONTROL DE BASES (arriba-derecha)
    // =========================
    const baseMaps = {
      'OSM': osm,
      'Satélite (Esri)': esriSat,
      'Gris (Carto Positron)': cartoLight
    };
    L.control.layers(baseMaps, null, { position: 'topright', collapsed: false }).addTo(map);

    // =========================
    // LEYENDA / GESTOR DE CAPAS (abajo-derecha)
    // =========================
    const LegendControl = L.Control.extend({
      options: { position: 'bottomright' },
      onAdd: function() {
        const div = L.DomUtil.create('div', 'legend-control leaflet-control');

        div.innerHTML = `
          <h4>Capas</h4>
          <div class="legend-section" id="layer-toggles">
            <label class="legend-item">
              <input type="checkbox" id="chk-enclaves" checked>
              <span class="legend-swatch point"></span>
              <span>Enclaves (puntos)</span>
            </label>
            <label class="legend-item">
              <input type="checkbox" id="chk-municipios" checked>
              <span class="legend-swatch line"></span>
              <span>Municipios (límite)</span>
            </label>
            <label class="legend-item">
              <input type="checkbox" id="chk-bic" checked>
              <span class="legend-swatch" style="background:#ccc;border-color:#666;"></span>
              <span>BIC Tenerife (polígonos)</span>
            </label>
            <label class="legend-item">
              <input type="checkbox" id="chk-enp" checked>
              <span class="legend-swatch" style="background:#eee;"></span>
              <span>ENP Tenerife (polígonos)</span>
            </label>
            <label class="legend-item">
              <input type="checkbox" id="chk-bios" checked>
              <span class="legend-swatch swatch-bios"></span>
              <span>Reserva de la Biosfera</span>
            </label>

            <div class="legend-slider" title="Opacidad límites municipios">
              <label for="muni-opacity" style="min-width:120px">Opacidad límites</label>
              <input id="muni-opacity" type="range" min="0" max="100" value="100" />
            </div>

            <div class="legend-slider" title="Opacidad polígonos BIC">
              <label for="bic-opacity" style="min-width:120px">Opacidad BIC</label>
              <input id="bic-opacity" type="range" min="0" max="100" value="50" />
            </div>

            <div class="legend-slider" title="Opacidad polígonos ENP">
              <label for="enp-opacity" style="min-width:120px">Opacidad ENP</label>
              <input id="enp-opacity" type="range" min="0" max="100" value="50" />
            </div>

            <div class="legend-slider" title="Opacidad Reserva Biosfera">
              <label for="bios-opacity" style="min-width:120px">Opacidad Biosfera</label>
              <input id="bios-opacity" type="range" min="0" max="100" value="50" />
            </div>
          </div>

          <div class="legend-section">
            <details open>
              <summary>Simbología BIC (por categoría)</summary>
              <div class="cat-list" id="bic-cats"></div>
            </details>
            <details open>
              <summary>Simbología ENP (por categoría)</summary>
              <div class="cat-list" id="enp-cats"></div>
            </details>
          </div>
        `;

        L.DomEvent.disableClickPropagation(div);

        // Checkboxes
        const chkEncl = div.querySelector('#chk-enclaves');
        const chkMun  = div.querySelector('#chk-municipios');
        const chkBic  = div.querySelector('#chk-bic');
        const chkEnp  = div.querySelector('#chk-enp');
        const chkBios = div.querySelector('#chk-bios');

        chkEncl.addEventListener('change', e=>{
          if(e.target.checked){ enclavesLayer.addTo(map); enclavesLayer.bringToFront(); }
          else{ map.removeLayer(enclavesLayer); }
        });
        chkMun.addEventListener('change', e=>{
          if(e.target.checked){ municipiosLayer.addTo(map); }
          else{ map.removeLayer(municipiosLayer); }
        });
        chkBic.addEventListener('change', e=>{
          if(e.target.checked){ bicLayer.addTo(map); enclavesLayer.bringToFront(); }
          else{ map.removeLayer(bicLayer); }
        });
        chkEnp.addEventListener('change', e=>{
          if(e.target.checked){ enpLayer.addTo(map); enclavesLayer.bringToFront(); }
          else{ map.removeLayer(enpLayer); }
        });
        chkBios.addEventListener('change', e=>{
          if(e.target.checked){ biosLayer.addTo(map); enclavesLayer.bringToFront(); }
          else{ map.removeLayer(biosLayer); }
        });

        // Sliders
        const muniOp = div.querySelector('#muni-opacity');
        muniOp.addEventListener('input', e=>{
          const v = Number(e.target.value)/100;
          municipiosLayer.setStyle({ opacity: v });
        });

        const bicOp = div.querySelector('#bic-opacity');
        bicOp.addEventListener('input', e=>{
          bicOpacity = Number(e.target.value)/100;
          bicLayer.setStyle(styleBIC);
          enclavesLayer.bringToFront();
        });

        const enpOp = div.querySelector('#enp-opacity');
        enpOp.addEventListener('input', e=>{
          enpOpacity = Number(e.target.value)/100;
          enpLayer.setStyle(styleENP);
          enclavesLayer.bringToFront();
        });

        const biosOp = div.querySelector('#bios-opacity');
        biosOp.addEventListener('input', e=>{
          biosOpacity = Number(e.target.value)/100;

          if (biosStripes && L.StripePattern) {
            // recrear patrón con nueva opacidad
            try { biosStripes.remove(); } catch(_e){}
            biosStripes = makeBiosPattern(biosOpacity);
            biosLayer.setStyle({ fillPattern: biosStripes, opacity: biosOpacity });
          } else {
            biosLayer.setStyle({ fillColor: BIOS_COLOR, fillOpacity: biosOpacity, opacity: biosOpacity });
          }
          enclavesLayer.bringToFront();
        });

        // Rellenar simbología BIC
        const bicCatsDiv = div.querySelector('#bic-cats');
        bicCatsDiv.innerHTML = Object.entries(BIC_COLORS).map(([key, c])=>{
          const fill = `rgb(${c.fill[0]},${c.fill[1]},${c.fill[2]})`;
          const stroke = `rgb(${c.stroke[0]},${c.stroke[1]},${c.stroke[2]})`;
          const label = BIC_LABELS[key] || key;
          return `
            <div class="cat-row">
              <span class="legend-swatch" style="background:${fill};border-color:${stroke}"></span>
              <span class="cat-name">${label}</span>
            </div>
          `;
        }).join('');

        // Rellenar simbología ENP (borde negro)
        const enpCatsDiv = div.querySelector('#enp-cats');
        enpCatsDiv.innerHTML = Object.entries(ENP_COLORS).map(([key, c])=>{
          const fill = `rgb(${c.fill[0]},${c.fill[1]},${c.fill[2]})`;
          const label = ENP_LABELS[key] || key;
          return `
            <div class="cat-row">
              <span class="legend-swatch" style="background:${fill};border-color:#000"></span>
              <span class="cat-name">${label}</span>
            </div>
          `;
        }).join('');

        return div;
      }
    });
    map.addControl(new LegendControl());

    // Escala
    L.control.scale({ metric: true, imperial: false, position: 'bottomleft' }).addTo(map);
  </script>
</body>
</html>
