<!doctype html> 
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visor Tenerife • Leaflet</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; width: 100%; }
    .top-right {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: white; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      padding: 8px 10px; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <div class="top-right" id="custom-panel" style="display:none"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    // Centro aproximado de Tenerife
    const centerTenerife = [28.2916, -16.6291];

    // (Opcional) Limitar el paneo a un rectángulo en torno a la isla
    // SW [lat, lon], NE [lat, lon]
    const maxBoundsTenerife = L.latLngBounds(
      [27.9, -17.2],   // suroeste
      [28.7, -15.8]    // noreste
    );

    // Crear el mapa
    const map = L.map('map', {
      center: centerTenerife,
      zoom: 10,            // buen nivel para ver toda la isla
      minZoom: 7,
      zoomControl: true,
      maxBounds: maxBoundsTenerife,   // quítalo si no quieres límites
      maxBoundsViscosity: 0.5
    });

    // Capas base
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    });

    const esriSat = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {
        maxZoom: 20,
        attribution: 'Imagery &copy; Esri, Earthstar Geographics'
      }
    );

    const cartoLight = L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      {
        maxZoom: 20,
        subdomains: 'abcd',
        attribution: '&copy; OpenStreetMap &copy; <a href="https://carto.com/attributions">CARTO</a>'
      }
    );

    // Añadir una por defecto
    osm.addTo(map);

    // =========================
    //  CAPA MUNICIPIOS (LÍMITE)
    // =========================
    // Pane específico por debajo de otros overlays (tilePane ~200, overlayPane ~400).
    // Lo situamos en 300 para que quede sobre el mapa base, pero por debajo de
    // enclaves, marcadores, etc. Además, sin interacción.
    const municipiosPaneName = 'municipios-pane';
    map.createPane(municipiosPaneName);
    map.getPane(municipiosPaneName).style.zIndex = 300;

    const municipiosStyle = {
      color: '#00599C',     // RGB(0, 89, 156)
      weight: 2,
      fill: false
    };

    const municipiosLayer = L.geoJSON(null, {
      pane: municipiosPaneName,
      interactive: false,   // sin clicks, solo visual
      style: municipiosStyle
    });

    fetch('https://raw.githubusercontent.com/geocyl/Tenerife_EnclavesPaisajisitcos/refs/heads/main/Munis_Limite.json')
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(geo => municipiosLayer.addData(geo))
      .catch(err => console.warn('No se pudo cargar municipios:', err));

    // Añadimos por defecto (para que siempre haga de “línea de fondo”)
    municipiosLayer.addTo(map);

    // =========================
    // CAPA ENCLAVES (PUNTOS)
    // =========================
    const enclavesStyle = {
      radius: 6,
      weight: 2,
      color: '#143D6B',
      fillColor: '#4DA3FF',
      fillOpacity: 0.9
    };

    const enclavesLayer = L.geoJSON(null, {
      pointToLayer: (feature, latlng) => L.circleMarker(latlng, enclavesStyle),
      onEachFeature: (feature, layer) => {
        const name = feature?.properties?.Name || 'Enclave';
        layer.bindPopup(`<b>${name}</b>`);
      }
    });

    fetch('https://raw.githubusercontent.com/geocyl/Tenerife_EnclavesPaisajisitcos/refs/heads/main/Puntos_Enclaves.json')
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(geo => enclavesLayer.addData(geo))
      .catch(err => console.warn('No se pudo cargar enclaves:', err));

    // Control de capas (añadimos overlays)
    const baseMaps = {
      'OSM': osm,
      'Satélite (Esri)': esriSat,
      'Gris (Carto Positron)': cartoLight
    };
    const overlays = {
      'Enclaves (puntos)': enclavesLayer,
      // Ofrecemos poder ocultar/mostrar el límite si quieres
      'Municipios (límite)': municipiosLayer
    };

    L.control.layers(
      baseMaps,
      overlays,
      { position: 'topright', collapsed: false }
    ).addTo(map);

    // Control de escala
    L.control.scale({ metric: true, imperial: false, position: 'bottomleft' }).addTo(map);

  </script>
</body>
</html>
