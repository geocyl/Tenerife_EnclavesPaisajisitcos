<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visor Tenerife • Leaflet</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; width: 100%; }
    .top-right {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: white; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      padding: 8px 10px; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <div class="top-right" id="custom-panel" style="display:none"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    // Centro aproximado de Tenerife
    const centerTenerife = [28.2916, -16.6291];

    // (Opcional) Limitar el paneo a un rectángulo en torno a la isla
    // SW [lat, lon], NE [lat, lon]
    const maxBoundsTenerife = L.latLngBounds(
      [27.9, -17.2],   // suroeste
      [28.7, -15.8]    // noreste
    );

    // Crear el mapa
    const map = L.map('map', {
      center: centerTenerife,
      zoom: 10,            // buen nivel para ver toda la isla
      minZoom: 7,
      zoomControl: true,
      maxBounds: maxBoundsTenerife,   // quítalo si no quieres límites
      maxBoundsViscosity: 0.5
    });

    // Capas base
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    });

    const esriSat = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {
        maxZoom: 20,
        attribution: 'Imagery &copy; Esri, Earthstar Geographics'
      }
    );

    const cartoLight = L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      {
        maxZoom: 20,
        subdomains: 'abcd',
        attribution: '&copy; OpenStreetMap &copy; <a href="https://carto.com/attributions">CARTO</a>'
      }
    );

    // Añadir una por defecto
    osm.addTo(map);

    // Control de capas
    L.control.layers(
      {
        'OSM': osm,
        'Satélite (Esri)': esriSat,
        'Gris (Carto Positron)': cartoLight
      },
      null,
      { position: 'topright', collapsed: false }
    ).addTo(map);

    // Control de escala
    L.control.scale({ metric: true, imperial: false, position: 'bottomleft' }).addTo(map);

    // Marcador de ejemplo (Santa Cruz de Tenerife)
    L.marker([28.4636, -16.2518])
      .addTo(map)
      .bindPopup('<b>Santa Cruz de Tenerife</b><br>Visor Leaflet de ejemplo.');
  </script>
</body>
</html>
