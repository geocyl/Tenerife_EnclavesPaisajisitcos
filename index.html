<!doctype html> 
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visor Tenerife • Leaflet</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; width: 100%; }
    .top-right {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: white; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      padding: 8px 10px; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 14px;
    }
    .opacity-control.leaflet-control {
      background: #fff; padding: 8px 10px; border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,.15); font: 13px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .opacity-control label { display: block; margin-bottom: 6px; }
    .opacity-control input[type="range"] { width: 160px; }
    .leaflet-bar a.emoji-btn { font-size: 18px; line-height: 26px; width: 26px; height: 26px; text-align: center; }
  </style>
</head>
<body>

  <div id="map"></div>
  <div class="top-right" id="custom-panel" style="display:none"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    // --- Centro/zoom iniciales ---
    const centerTenerife = [28.2916, -16.6291];
    const initialZoom = 10;

    const maxBoundsTenerife = L.latLngBounds([27.9, -17.2], [28.7, -15.8]);

    const map = L.map('map', {
      center: centerTenerife,
      zoom: initialZoom,
      minZoom: 7,
      zoomControl: true,
      maxBounds: maxBoundsTenerife,
      maxBoundsViscosity: 0.5
    });

    // --- Botón HOME (volver a vista inicial) ---
    const HomeControl = L.Control.extend({
      options: { position: 'topleft' },
      onAdd: function() {
        const container = L.DomUtil.create('div', 'leaflet-bar');
        const link = L.DomUtil.create('a', 'emoji-btn', container);
        link.href = '#';
        link.title = 'Volver a vista inicial';
        link.setAttribute('aria-label','Volver a vista inicial');
        link.innerHTML = '🏠';
        L.DomEvent.on(link, 'click', L.DomEvent.stop)
                  .on(link, 'click', () => map.setView(centerTenerife, initialZoom));
        return container;
      }
    });
    map.addControl(new HomeControl());

    // --- Botón GEOLOCALIZACIÓN ---
    let locateMarker, locateCircle;
    const LocateControl = L.Control.extend({
      options: { position: 'topleft' }, // se añade después del home, queda debajo
      onAdd: function() {
        const container = L.DomUtil.create('div', 'leaflet-bar');
        const link = L.DomUtil.create('a', 'emoji-btn', container);
        link.href = '#';
        link.title = 'Ir a mi ubicación';
        link.setAttribute('aria-label','Ir a mi ubicación');
        link.innerHTML = '📍';
        L.DomEvent.on(link, 'click', L.DomEvent.stop)
                  .on(link, 'click', () => {
                    if (!navigator.geolocation) {
                      alert('Tu navegador no soporta geolocalización.');
                      return;
                    }
                    navigator.geolocation.getCurrentPosition(
                      (pos) => {
                        const latlng = [pos.coords.latitude, pos.coords.longitude];
                        const acc = pos.coords.accuracy || 50;

                        if (!locateMarker) {
                          locateMarker = L.marker(latlng, { title: 'Mi ubicación' }).addTo(map);
                        } else {
                          locateMarker.setLatLng(latlng);
                        }

                        if (!locateCircle) {
                          locateCircle = L.circle(latlng, { radius: acc }).addTo(map);
                        } else {
                          locateCircle.setLatLng(latlng).setRadius(acc);
                        }

                        map.flyTo(latlng, 14, { duration: 0.8 });
                      },
                      (err) => alert('No se pudo obtener tu ubicación (' + err.message + ').'),
                      { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
                    );
                  });
        return container;
      }
    });
    map.addControl(new LocateControl());

    // --- Bases ---
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    });

    const esriSat = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 20, attribution: 'Imagery &copy; Esri, Earthstar Geographics' }
    );

    const cartoLight = L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      { maxZoom: 20, subdomains: 'abcd', attribution: '&copy; OpenStreetMap &copy; <a href="https://carto.com/attributions">CARTO</a>' }
    );

    osm.addTo(map); // base por defecto

    // =========================
    //  CAPA MUNICIPIOS (LÍMITE)
    // =========================
    const municipiosPaneName = 'municipios-pane';
    map.createPane(municipiosPaneName);
    map.getPane(municipiosPaneName).style.zIndex = 300; // por debajo de otros overlays

    const municipiosStyle = { color: '#00599C', weight: 2, fill: false, opacity: 1 };

    const municipiosLayer = L.geoJSON(null, {
      pane: municipiosPaneName,
      interactive: false,  // sin clics
      style: municipiosStyle
    });

    fetch('https://raw.githubusercontent.com/geocyl/Tenerife_EnclavesPaisajisitcos/refs/heads/main/Munis_Limite.json')
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(geo => municipiosLayer.addData(geo))
      .catch(err => console.warn('No se pudo cargar municipios:', err));

    municipiosLayer.addTo(map); // activa desde el inicio

    // =========================
    // CAPA ENCLAVES (PUNTOS)
    // =========================
    const enclavesStyle = { radius: 6, weight: 2, color: '#143D6B', fillColor: '#4DA3FF', fillOpacity: 0.9 };

    const enclavesLayer = L.geoJSON(null, {
      pointToLayer: (feature, latlng) => L.circleMarker(latlng, enclavesStyle),
      onEachFeature: (feature, layer) => {
        const name = feature?.properties?.Name || 'Enclave';
        layer.bindPopup(`<b>${name}</b>`);
      }
    });

    fetch('https://raw.githubusercontent.com/geocyl/Tenerife_EnclavesPaisajisitcos/refs/heads/main/Puntos_Enclaves.json')
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(geo => enclavesLayer.addData(geo))
      .catch(err => console.warn('No se pudo cargar enclaves:', err));

    enclavesLayer.addTo(map); // activa desde el inicio

    // =========================
    // CAPA BIC TENERIFE (POLÍGONOS)
    // =========================
    const bicStyle = {
      color: '#d9534f',   // contorno rojo
      weight: 2,
      fillColor: '#d9534f',
      fillOpacity: 0.15
    };

    const bicLayer = L.geoJSON(null, {
      style: bicStyle,
      onEachFeature: (feature, layer) => {
        const name = feature?.properties?.Name || 'BIC';
        layer.bindPopup(`<b>${name}</b>`);
      }
    });

    fetch('https://raw.githubusercontent.com/geocyl/Tenerife_EnclavesPaisajisitcos/refs/heads/main/BIC_Tenerife_WGS84.geojson')
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(geo => bicLayer.addData(geo))
      .catch(err => console.warn('No se pudo cargar BIC:', err));

    bicLayer.addTo(map); // activa desde el inicio

    // =========================
    // CONTROLES DE CAPAS
    // =========================
    const baseMaps = {
      'OSM': osm,
      'Satélite (Esri)': esriSat,
      'Gris (Carto Positron)': cartoLight
    };
    const overlays = {
      'Enclaves (puntos)': enclavesLayer,
      'Municipios (límite)': municipiosLayer,
      'BIC Tenerife (polígonos)': bicLayer
    };

    // Control SOLO bases (arriba-derecha)
    L.control.layers(baseMaps, null, { position: 'topright', collapsed: false }).addTo(map);

    // Control SOLO overlays (abajo-derecha)
    L.control.layers(null, overlays, { position: 'bottomright', collapsed: false }).addTo(map);

    // --- Control de Opacidad para Municipios (abajo-derecha) ---
    const OpacityControl = L.Control.extend({
      options: { position: 'bottomright' },
      onAdd: function() {
        const div = L.DomUtil.create('div', 'opacity-control leaflet-control');
        div.innerHTML = `
          <label for="muni-opacity">Opacidad límites</label>
          <input id="muni-opacity" type="range" min="0" max="100" value="100" />
        `;
        const input = div.querySelector('#muni-opacity');

        // Evitar que el drag del mapa se active al usar el slider
        L.DomEvent.disableClickPropagation(div);
        L.DomEvent.on(input, 'input', (e) => {
          const v = Number(e.target.value) / 100; // 0..1
          municipiosLayer.setStyle({ opacity: v });
        });

        return div;
      }
    });
    map.addControl(new OpacityControl());

    // Escala
    L.control.scale({ metric: true, imperial: false, position: 'bottomleft' }).addTo(map);
  </script>
</body>
</html>
